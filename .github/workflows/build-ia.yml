name: Build Moonlight IA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner image already ships the Android SDK; just accept licenses and add the NDK
      - name: Android SDK and NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.14206865"

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleNonRootRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Moonlight-IA
          path: app/build/outputs/apk/nonRoot/release/*.apk
          if-no-files-found: error

      # Latest build as a GitHub release, easy to download from the phone
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/nonRoot/release/*.apk Moonlight-IA.apk
          gh release delete ia-latest --yes --cleanup-tag || true
          gh release create ia-latest Moonlight-IA.apk \
            --title "Moonlight IA (última compilación)" \
            --notes "Compilado desde ${GITHUB_SHA::7}. Descarga Moonlight-IA.apk e instálala en el móvil." \
            --target "$GITHUB_SHA"
