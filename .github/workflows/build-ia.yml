name: Build Moonlight IA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner image already ships the Android SDK; just accept licenses and add the NDK
      - name: Android SDK and NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.14206865"

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleNonRootRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Moonlight-IA
          path: app/build/outputs/apk/nonRoot/release/*.apk
          if-no-files-found: error
